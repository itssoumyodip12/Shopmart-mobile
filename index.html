<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>shopmart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Inter', sans-serif; overscroll-behavior-y: contain; }
  input, select, button { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

const CATS = ["All", "Electronics", "Home & Kitchen", "Fashion", "Books", "Toys & Games", "Beauty"];
const CAT_ACCENT = {
  "Electronics": { bg: "#EAF1F0", text: "#2A5450" },
  "Home & Kitchen": { bg: "#FCF3E3", text: "#7A5A1E" },
  "Fashion": { bg: "#FBEAE4", text: "#7C3B27" },
  "Books": { bg: "#EDEBF7", text: "#3B3260" },
  "Toys & Games": { bg: "#E8F2E7", text: "#33582F" },
  "Beauty": { bg: "#FBEAF0", text: "#75324D" },
};

const PRODUCTS = [
  { id: 1, name: "Wireless Noise-Cancelling Headphones", category: "Electronics", price: 89.99, was: 129.99, rating: 4.5, reviews: 2318, emoji: "🎧", desc: "Over-ear headphones with active noise cancellation, 30-hour battery life, and plush memory-foam ear cushions for all-day comfort.", badge: "Deal", stock: 24 },
  { id: 2, name: "Smart Fitness Watch", category: "Electronics", price: 54.5, was: null, rating: 4.2, reviews: 891, emoji: "⌚", desc: "Track steps, heart rate, sleep, and workouts. Water-resistant with a 10-day battery and full-color touchscreen.", badge: "Bestseller", stock: 41 },
  { id: 3, name: "Portable Bluetooth Speaker", category: "Electronics", price: 32.0, was: 45.0, rating: 4.6, reviews: 5120, emoji: "🔊", desc: "Compact speaker with rich bass, IPX7 waterproofing, and 12 hours of playtime. Pairs with two devices at once.", badge: null, stock: 63 },
  { id: 4, name: "27-inch 4K Monitor", category: "Electronics", price: 219.99, was: 269.99, rating: 4.7, reviews: 634, emoji: "🖥️", desc: "Ultra-HD display with HDR support, 99% sRGB color accuracy, and a slim-bezel design for multi-monitor setups.", badge: "Deal", stock: 12 },
  { id: 5, name: "Mechanical Keyboard", category: "Electronics", price: 61.99, was: null, rating: 4.4, reviews: 1207, emoji: "⌨️", desc: "Hot-swappable switches, per-key RGB lighting, and a durable aluminum frame built for long typing sessions.", badge: null, stock: 30 },
  { id: 6, name: "Non-Stick Cookware Set (10-piece)", category: "Home & Kitchen", price: 74.99, was: 99.99, rating: 4.6, reviews: 3011, emoji: "🍳", desc: "Ten-piece set including pots, pans, and lids, coated with a durable non-stick surface that's oven-safe to 400°F.", badge: "Bestseller", stock: 18 },
  { id: 7, name: "Robot Vacuum Cleaner", category: "Home & Kitchen", price: 159.0, was: 219.0, rating: 4.3, reviews: 2244, emoji: "🤖", desc: "Smart mapping navigation, app control, and automatic recharging. Picks up pet hair, dust, and crumbs with ease.", badge: "Deal", stock: 9 },
  { id: 8, name: "Memory Foam Pillow (2-Pack)", category: "Home & Kitchen", price: 28.99, was: null, rating: 4.5, reviews: 987, emoji: "🛏️", desc: "Contoured cervical support pillows with a breathable, removable cover. Helps relieve neck and shoulder tension.", badge: null, stock: 55 },
  { id: 9, name: "Electric Kettle, Glass", category: "Home & Kitchen", price: 22.5, was: 29.99, rating: 4.4, reviews: 1580, emoji: "🫖", desc: "1.7L borosilicate glass kettle with a blue LED indicator, auto shut-off, and boil-dry protection.", badge: null, stock: 47 },
  { id: 10, name: "Weighted Blanket (15 lb)", category: "Home & Kitchen", price: 45.0, was: null, rating: 4.7, reviews: 4102, emoji: "🧣", desc: "Glass-bead filled blanket that evenly distributes weight for a calming, cozy feel year-round.", badge: "Bestseller", stock: 21 },
  { id: 11, name: "Men's Classic Denim Jacket", category: "Fashion", price: 39.99, was: 54.99, rating: 4.3, reviews: 612, emoji: "🧥", desc: "Timeless straight-fit denim jacket in washed indigo, with button cuffs and chest pockets.", badge: "Deal", stock: 33 },
  { id: 12, name: "Women's Running Shoes", category: "Fashion", price: 48.0, was: 65.0, rating: 4.5, reviews: 2790, emoji: "👟", desc: "Lightweight mesh upper with responsive foam cushioning, built for daily training and long-distance runs.", badge: "Bestseller", stock: 40 },
  { id: 13, name: "Leather Crossbody Bag", category: "Fashion", price: 36.5, was: null, rating: 4.4, reviews: 455, emoji: "👜", desc: "Genuine leather bag with adjustable strap, interior zip pocket, and a soft suede lining.", badge: null, stock: 26 },
  { id: 14, name: "Polarized Sunglasses", category: "Fashion", price: 18.99, was: 25.0, rating: 4.2, reviews: 1338, emoji: "🕶️", desc: "UV400 protection with anti-glare polarized lenses and a lightweight, flexible frame.", badge: null, stock: 70 },
  { id: 15, name: "Wool-Blend Beanie", category: "Fashion", price: 12.99, was: null, rating: 4.6, reviews: 320, emoji: "🧢", desc: "Soft ribbed knit beanie that keeps its shape wash after wash. One size fits most.", badge: null, stock: 90 },
  { id: 16, name: "Atomic Habits (Paperback)", category: "Books", price: 11.99, was: 16.99, rating: 4.8, reviews: 18420, emoji: "📘", desc: "A practical guide to building good habits and breaking bad ones, one tiny change at a time.", badge: "Bestseller", stock: 120 },
  { id: 17, name: "The Silent Patient (Hardcover)", category: "Books", price: 14.5, was: null, rating: 4.6, reviews: 9280, emoji: "📕", desc: "A gripping psychological thriller about a woman's act of violence against her husband — and her refusal to speak.", badge: null, stock: 58 },
  { id: 18, name: "Kids' Illustrated Encyclopedia", category: "Books", price: 19.99, was: 24.99, rating: 4.7, reviews: 740, emoji: "📗", desc: "A richly illustrated reference covering science, history, and nature, written for curious young readers.", badge: "Deal", stock: 34 },
  { id: 19, name: "Notebook Set (3-Pack)", category: "Books", price: 9.99, was: null, rating: 4.5, reviews: 502, emoji: "📓", desc: "Dot-grid notebooks with 160 pages each, a stitched spine, and an elastic closure band.", badge: null, stock: 200 },
  { id: 20, name: "Wooden Building Blocks (100 pc)", category: "Toys & Games", price: 27.99, was: 34.99, rating: 4.8, reviews: 1904, emoji: "🧱", desc: "Smooth, sustainably-sourced wooden blocks in varied shapes and colors for open-ended creative play.", badge: "Bestseller", stock: 44 },
  { id: 21, name: "Strategy Board Game", category: "Toys & Games", price: 24.99, was: null, rating: 4.6, reviews: 866, emoji: "🎲", desc: "A fast-playing strategy game for 2-4 players, with easy-to-learn rules and deep replayability.", badge: null, stock: 37 },
  { id: 22, name: "Remote Control Race Car", category: "Toys & Games", price: 31.5, was: 42.0, rating: 4.3, reviews: 588, emoji: "🚗", desc: "High-speed RC car with all-terrain tires, rechargeable battery, and a 100-meter control range.", badge: "Deal", stock: 22 },
  { id: 23, name: "Vitamin C Serum", category: "Beauty", price: 16.99, was: 22.0, rating: 4.5, reviews: 6721, emoji: "🧴", desc: "Brightening facial serum with 20% vitamin C and hyaluronic acid to even tone and hydrate skin.", badge: "Bestseller", stock: 66 },
  { id: 24, name: "Ceramic Hair Straightener", category: "Beauty", price: 29.99, was: null, rating: 4.4, reviews: 1450, emoji: "💇", desc: "Floating ceramic plates with adjustable heat settings up to 450°F and a fast 30-second heat-up.", badge: null, stock: 29 },
];

function money(n) { return "$" + n.toFixed(2); }

function StarRow({ rating, reviews, size }) {
  size = size || 12;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
      <div style={{ display: "flex", gap: 1 }}>
        {[1,2,3,4,5].map((i) => <span key={i} style={{ color: i <= Math.round(rating) ? "#C6912F" : "#D9D5C6", fontSize: size }}>★</span>)}
      </div>
      <span style={{ fontSize: 11.5, color: "#6B6858" }}>{rating.toFixed(1)} ({reviews > 999 ? (reviews/1000).toFixed(1) + "k" : reviews})</span>
    </div>
  );
}

function PriceStamp({ price, was, size }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", gap: 6, flexWrap: "wrap" }}>
      <span style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: size || 18, color: "#1B1F3B" }}>{money(price)}</span>
      {was && <span style={{ fontSize: 12, color: "#948F7C", textDecoration: "line-through" }}>{money(was)}</span>}
    </div>
  );
}

function Badge({ text }) {
  const c = text === "Deal" ? { bg: "#E4623F", fg: "#fff" } : { bg: "#1B1F3B", fg: "#F1EAD9" };
  return (
    <span style={{ position: "absolute", top: 8, left: 0, background: c.bg, color: c.fg, fontSize: 9.5, fontWeight: 700, letterSpacing: 0.3, padding: "3px 8px", borderRadius: "0 3px 3px 0", textTransform: "uppercase", zIndex: 2 }}>{text}</span>
  );
}

function Sheet({ open, onClose, title, children, heightVh }) {
  if (!open) return null;
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 80 }}>
      <div onClick={onClose} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.4)" }} />
      <div style={{
        position: "absolute", left: 0, right: 0, bottom: 0, background: "#F6F3EA",
        borderRadius: "16px 16px 0 0", maxHeight: (heightVh || 75) + "vh", display: "flex", flexDirection: "column",
        boxShadow: "0 -8px 24px rgba(0,0,0,0.2)"
      }}>
        <div style={{ display: "flex", justifyContent: "center", padding: "10px 0 4px" }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: "#D8D5C4" }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 18px 12px", borderBottom: "1px solid #E4E1D3" }}>
          <span style={{ fontFamily: "Fraunces, serif", fontWeight: 700, fontSize: 17 }}>{title}</span>
          <button onClick={onClose} style={{ background: "#EAE6D8", border: "none", borderRadius: "50%", width: 30, height: 30, fontSize: 15, cursor: "pointer" }}>✕</button>
        </div>
        <div style={{ overflowY: "auto", padding: 18 }}>{children}</div>
      </div>
    </div>
  );
}

function ShopMart() {
  const [view, setView] = useState("home");
  const [cart, setCart] = useState({});
  const [wishlist, setWishlist] = useState(new Set());
  const [cartOpen, setCartOpen] = useState(false);
  const [filterOpen, setFilterOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");
  const [sortBy, setSortBy] = useState("featured");
  const [maxPrice, setMaxPrice] = useState(250);
  const [minRating, setMinRating] = useState(0);
  const [orders, setOrders] = useState([]);
  const [address, setAddress] = useState({ name: "", street: "", city: "", zip: "", card: "" });
  const [lastOrder, setLastOrder] = useState(null);
  const [toast, setToast] = useState(null);

  function showToast(msg) { setToast(msg); setTimeout(() => setToast(null), 1600); }
  function addToCart(id) { setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 })); showToast("Added to cart"); }
  function setQty(id, qty) { setCart((c) => { const n = { ...c }; if (qty <= 0) delete n[id]; else n[id] = qty; return n; }); }
  function removeFromCart(id) { setCart((c) => { const n = { ...c }; delete n[id]; return n; }); }
  function toggleWishlist(id) { setWishlist((w) => { const n = new Set(w); n.has(id) ? n.delete(id) : n.add(id); return n; }); }

  const cartItems = useMemo(() => Object.entries(cart).map(([id, qty]) => ({ ...PRODUCTS.find((p) => p.id === Number(id)), qty })), [cart]);
  const cartCount = cartItems.reduce((s, i) => s + i.qty, 0);
  const subtotal = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
  const shipping = subtotal > 35 || subtotal === 0 ? 0 : 4.99;
  const tax = subtotal * 0.0725;
  const total = subtotal + shipping + tax;

  const filtered = useMemo(() => {
    let list = PRODUCTS.filter((p) => (category === "All" || p.category === category) && p.price <= maxPrice && p.rating >= minRating && p.name.toLowerCase().includes(query.toLowerCase()));
    if (sortBy === "priceLow") list = [...list].sort((a, b) => a.price - b.price);
    else if (sortBy === "priceHigh") list = [...list].sort((a, b) => b.price - a.price);
    else if (sortBy === "rating") list = [...list].sort((a, b) => b.rating - a.rating);
    return list;
  }, [query, category, sortBy, maxPrice, minRating]);

  function openProduct(p) { setSelectedProduct(p); setView("product"); window.scrollTo(0, 0); }
  function placeOrder(e) {
    e.preventDefault();
    if (!address.name || !address.street || !address.city || !address.zip || !address.card) { showToast("Fill in all fields"); return; }
    const order = { id: "SM-" + Math.floor(100000 + Math.random() * 900000), items: cartItems, total, date: new Date() };
    setOrders((o) => [order, ...o]);
    setLastOrder(order);
    setCart({});
    setView("confirmation");
  }

  const inputStyle = { border: "1px solid #D8D5C4", borderRadius: 8, padding: "13px 14px", fontSize: 16, outline: "none", width: "100%" };
  const navBtn = (active) => ({ background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, color: active ? "#1B1F3B" : "#9C9885", fontSize: 10.5, fontWeight: 600, cursor: "pointer", flex: 1, padding: "6px 0", position: "relative" });

  function SummaryRow({ label, value, bold }) {
    return <div style={{ display: "flex", justifyContent: "space-between", fontSize: bold ? 15 : 13.5, fontWeight: bold ? 700 : 400, marginBottom: 8, color: bold ? "#22241F" : "#5C594A" }}><span>{label}</span><span>{value === 0 ? "FREE" : money(value)}</span></div>;
  }

  return (
    <div style={{ fontFamily: "Inter, sans-serif", background: "#EEF1EE", minHeight: "100vh", color: "#22241F", maxWidth: 480, margin: "0 auto", position: "relative", paddingBottom: 66 }}>

      <header style={{ background: "#1B1F3B", color: "#F1EAD9", position: "sticky", top: 0, zIndex: 40 }}>
        <div style={{ padding: "12px 14px 8px", display: "flex", alignItems: "center", gap: 10 }}>
          <div onClick={() => setView("home")} style={{ cursor: "pointer", fontFamily: "Fraunces, serif", fontWeight: 800, fontSize: 21 }}>
            shop<span style={{ color: "#D9A441" }}>mart</span>
          </div>
          <div style={{ flex: 1 }} />
          <button onClick={() => toggleWishlist("__view__")} style={{ display: "none" }} />
        </div>
        <div style={{ padding: "0 14px 10px", display: "flex", gap: 8 }}>
          <div style={{ flex: 1, display: "flex", alignItems: "center", background: "#F1EAD9", borderRadius: 8, overflow: "hidden" }}>
            <span style={{ marginLeft: 10, color: "#7A7660", fontSize: 15 }}>🔍</span>
            <input value={query} onChange={(e) => { setQuery(e.target.value); setView("home"); }} placeholder="Search shopmart"
              style={{ border: "none", outline: "none", padding: "10px 8px", flex: 1, fontSize: 15, background: "transparent", color: "#22241F", minWidth: 0 }} />
          </div>
        </div>
        <div style={{ background: "#252A4D", overflowX: "auto", whiteSpace: "nowrap", padding: "8px 14px" }}>
          {CATS.map((c) => (
            <button key={c} onClick={() => { setCategory(c); setView("home"); }} style={{
              background: category === c ? "#D9A441" : "transparent", border: category === c ? "none" : "1px solid #454B78",
              color: category === c ? "#1B1F3B" : "#D8D5C4", fontWeight: 600, fontSize: 12.5, padding: "5px 12px",
              borderRadius: 999, marginRight: 8, cursor: "pointer"
            }}>{c}</button>
          ))}
        </div>
      </header>

      {toast && <div style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 100, background: "#1B1F3B", color: "#F1EAD9", padding: "9px 16px", borderRadius: 8, fontSize: 13, boxShadow: "0 6px 18px rgba(0,0,0,0.25)" }}>✓ {toast}</div>}

      {view === "home" && (
        <main style={{ padding: "14px 14px 20px" }}>
          {!query && category === "All" && (
            <div style={{ background: "linear-gradient(120deg,#1B1F3B,#2E3564)", borderRadius: 14, color: "#F1EAD9", padding: "22px 18px", marginBottom: 16 }}>
              <div style={{ color: "#D9A441", fontWeight: 700, fontSize: 11, letterSpacing: 1, textTransform: "uppercase", marginBottom: 6 }}>The weekend bazaar</div>
              <div style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 700, marginBottom: 6, lineHeight: 1.2 }}>Everything you need, priced to move.</div>
              <div style={{ color: "#C9C5B0", fontSize: 13, lineHeight: 1.5 }}>Free delivery on orders over $35 🛍️</div>
            </div>
          )}

          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            <button onClick={() => setFilterOpen(true)} style={{ flex: 1, background: "#fff", border: "1px solid #D8D5C4", borderRadius: 8, padding: "10px 0", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              🧰 Filter & Sort
            </button>
            <div style={{ background: "#fff", border: "1px solid #D8D5C4", borderRadius: 8, padding: "10px 14px", fontSize: 13, color: "#5C594A", whiteSpace: "nowrap" }}>{filtered.length} items</div>
          </div>

          {filtered.length === 0 ? (
            <div style={{ background: "#fff", borderRadius: 10, padding: 40, textAlign: "center", color: "#6B6858", fontSize: 13.5 }}>No products match. Try adjusting filters.</div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {filtered.map((p) => {
                const accent = CAT_ACCENT[p.category];
                return (
                  <div key={p.id} onClick={() => openProduct(p)} style={{ background: "#fff", borderRadius: 10, position: "relative", overflow: "hidden", border: "1px solid #E4E1D3" }}>
                    {p.badge && <Badge text={p.badge} />}
                    <button onClick={(e) => { e.stopPropagation(); toggleWishlist(p.id); }} style={{ position: "absolute", top: 6, right: 6, zIndex: 3, background: "rgba(255,255,255,0.9)", border: "none", borderRadius: "50%", width: 28, height: 28, fontSize: 14 }}>
                      <span style={{ color: wishlist.has(p.id) ? "#C9603E" : "#8A8672" }}>{wishlist.has(p.id) ? "♥" : "♡"}</span>
                    </button>
                    <div style={{ background: accent.bg, height: 100, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 40 }}>{p.emoji}</div>
                    <div style={{ padding: 10, display: "flex", flexDirection: "column", gap: 5 }}>
                      <span style={{ fontSize: 9.5, fontWeight: 700, color: accent.text, textTransform: "uppercase" }}>{p.category}</span>
                      <div style={{ fontSize: 12.5, fontWeight: 600, lineHeight: 1.3, minHeight: 32 }}>{p.name}</div>
                      <StarRow rating={p.rating} reviews={p.reviews} />
                      <PriceStamp price={p.price} was={p.was} size={16} />
                      <button onClick={(e) => { e.stopPropagation(); addToCart(p.id); }} style={{ marginTop: 4, background: "#1B1F3B", color: "#F1EAD9", border: "none", borderRadius: 6, padding: "9px 0", fontSize: 12, fontWeight: 700 }}>Add to cart</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </main>
      )}

      {view === "product" && selectedProduct && (
        <main style={{ paddingBottom: 90 }}>
          <div style={{ padding: "12px 14px" }}>
            <button onClick={() => setView("home")} style={{ background: "none", border: "none", color: "#3F7C74", fontSize: 13.5, fontWeight: 600 }}>← Back</button>
          </div>
          <div style={{ background: CAT_ACCENT[selectedProduct.category].bg, height: 220, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 96 }}>{selectedProduct.emoji}</div>
          <div style={{ background: "#fff", borderRadius: "16px 16px 0 0", marginTop: -16, padding: 20, position: "relative" }}>
            <span style={{ fontSize: 11, fontWeight: 700, color: CAT_ACCENT[selectedProduct.category].text, textTransform: "uppercase" }}>{selectedProduct.category}</span>
            <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 20, fontWeight: 700, margin: "6px 0 8px" }}>{selectedProduct.name}</h1>
            <StarRow rating={selectedProduct.rating} reviews={selectedProduct.reviews} size={14} />
            <div style={{ margin: "14px 0" }}><PriceStamp price={selectedProduct.price} was={selectedProduct.was} size={22} /></div>
            <p style={{ fontSize: 13.5, color: "#5C594A", lineHeight: 1.6, marginBottom: 16 }}>{selectedProduct.desc}</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, fontSize: 12.5, color: "#5C594A", marginBottom: 16, background: "#F6F3EA", borderRadius: 10, padding: 12 }}>
              <div>🚚 {selectedProduct.price > 35 ? "Free delivery" : "$4.99 delivery"}</div>
              <div>🔄 30-day returns</div>
              <div>✅ Secure checkout</div>
            </div>
            <div style={{ fontSize: 12.5, color: selectedProduct.stock < 15 ? "#C9603E" : "#3F7C74", fontWeight: 600 }}>{selectedProduct.stock < 15 ? "Only " + selectedProduct.stock + " left in stock" : "In stock"}</div>
          </div>
          <div style={{ position: "fixed", bottom: 66, left: 0, right: 0, maxWidth: 480, margin: "0 auto", background: "#fff", borderTop: "1px solid #E4E1D3", padding: 12, display: "flex", gap: 10, zIndex: 30 }}>
            <button onClick={() => toggleWishlist(selectedProduct.id)} style={{ background: "#F6F3EA", border: "1px solid #D8D5C4", borderRadius: 8, width: 46, fontSize: 17 }}>{wishlist.has(selectedProduct.id) ? "♥" : "♡"}</button>
            <button onClick={() => addToCart(selectedProduct.id)} style={{ flex: 1, background: "#1B1F3B", color: "#F1EAD9", border: "none", borderRadius: 8, fontWeight: 700, fontSize: 13.5 }}>Add to cart</button>
            <button onClick={() => { addToCart(selectedProduct.id); setView("checkout"); }} style={{ flex: 1, background: "#D9A441", color: "#1B1F3B", border: "none", borderRadius: 8, fontWeight: 700, fontSize: 13.5 }}>Buy now</button>
          </div>
        </main>
      )}

      {view === "checkout" && (
        <main style={{ padding: "16px 14px 30px" }}>
          <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 700, marginBottom: 16 }}>Checkout</h1>
          <div style={{ background: "#fff", borderRadius: 10, padding: 16, marginBottom: 14 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 10 }}>Order summary</div>
            {cartItems.map((i) => <div key={i.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 6, color: "#5C594A" }}><span>{i.emoji} {i.name} × {i.qty}</span><span>{money(i.price * i.qty)}</span></div>)}
            <hr style={{ border: "none", borderTop: "1px solid #E4E1D3", margin: "10px 0" }} />
            <SummaryRow label="Subtotal" value={subtotal} />
            <SummaryRow label="Shipping" value={shipping} />
            <SummaryRow label="Tax" value={tax} />
            <hr style={{ border: "none", borderTop: "1px solid #E4E1D3", margin: "10px 0" }} />
            <SummaryRow label="Total" value={total} bold />
          </div>
          <form onSubmit={placeOrder} style={{ background: "#fff", borderRadius: 10, padding: 16 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 10 }}>📍 Shipping address</div>
            <div style={{ display: "grid", gap: 10, marginBottom: 18 }}>
              <input placeholder="Full name" value={address.name} onChange={(e) => setAddress({ ...address, name: e.target.value })} style={inputStyle} />
              <input placeholder="Street address" value={address.street} onChange={(e) => setAddress({ ...address, street: e.target.value })} style={inputStyle} />
              <div style={{ display: "flex", gap: 10 }}>
                <input placeholder="City" value={address.city} onChange={(e) => setAddress({ ...address, city: e.target.value })} style={{ ...inputStyle, flex: 1 }} />
                <input placeholder="ZIP" value={address.zip} onChange={(e) => setAddress({ ...address, zip: e.target.value })} style={{ ...inputStyle, width: 100 }} />
              </div>
            </div>
            <div style={{ fontWeight: 700, fontSize: 13.5, marginBottom: 10 }}>💳 Payment</div>
            <input placeholder="Card number" value={address.card} onChange={(e) => setAddress({ ...address, card: e.target.value })} style={{ ...inputStyle, marginBottom: 18 }} />
            <button type="submit" style={{ width: "100%", background: "#D9A441", color: "#1B1F3B", border: "none", borderRadius: 8, padding: "14px 0", fontWeight: 700, fontSize: 15 }}>Place order — {money(total)}</button>
          </form>
        </main>
      )}

      {view === "confirmation" && lastOrder && (
        <main style={{ padding: "40px 20px", textAlign: "center" }}>
          <div style={{ width: 56, height: 56, borderRadius: "50%", background: "#E8F2E7", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 16px", fontSize: 24, color: "#4E8A4A" }}>✓</div>
          <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 700, marginBottom: 8 }}>Order placed</h1>
          <p style={{ color: "#5C594A", fontSize: 13, marginBottom: 20 }}>Confirmation <strong>{lastOrder.id}</strong> — arriving by {new Date(Date.now() + 5 * 86400000).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}.</p>
          <div style={{ background: "#fff", borderRadius: 10, padding: 16, textAlign: "left", marginBottom: 20 }}>
            {lastOrder.items.map((i) => <div key={i.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 6 }}><span>{i.emoji} {i.name} × {i.qty}</span><span>{money(i.price * i.qty)}</span></div>)}
            <hr style={{ border: "none", borderTop: "1px solid #E4E1D3", margin: "10px 0" }} />
            <SummaryRow label="Total" value={lastOrder.total} bold />
          </div>
          <button onClick={() => setView("home")} style={{ background: "#1B1F3B", color: "#F1EAD9", border: "none", borderRadius: 8, padding: "12px 26px", fontWeight: 700, fontSize: 13.5 }}>Continue shopping</button>
        </main>
      )}

      {view === "orders" && (
        <main style={{ padding: "16px 14px 30px" }}>
          <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 21, fontWeight: 700, marginBottom: 16 }}>Your orders</h1>
          {orders.length === 0 ? (
            <div style={{ background: "#fff", borderRadius: 10, padding: 40, textAlign: "center", color: "#6B6858", fontSize: 13.5 }}>📦<div style={{ marginTop: 6 }}>No orders yet this session.</div></div>
          ) : orders.map((o) => (
            <div key={o.id} style={{ background: "#fff", borderRadius: 10, padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, fontSize: 12, color: "#6B6858" }}><span>{o.id} · {o.date.toLocaleDateString()}</span><span style={{ fontWeight: 700, color: "#22241F" }}>{money(o.total)}</span></div>
              {o.items.map((i) => <div key={i.id} style={{ fontSize: 12.5, marginBottom: 3 }}>{i.emoji} {i.name} × {i.qty}</div>)}
            </div>
          ))}
        </main>
      )}

      {/* BOTTOM NAV */}
      <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 480, margin: "0 auto", background: "#fff", borderTop: "1px solid #E4E1D3", display: "flex", zIndex: 50, boxShadow: "0 -2px 10px rgba(0,0,0,0.05)" }}>
        <button onClick={() => setView("home")} style={navBtn(view === "home")}><span style={{ fontSize: 18 }}>🏠</span>Home</button>
        <button onClick={() => setFilterOpen(true)} style={navBtn(filterOpen)}><span style={{ fontSize: 18 }}>🧰</span>Filter</button>
        <button onClick={() => setCartOpen(true)} style={navBtn(cartOpen)}>
          <span style={{ fontSize: 18, position: "relative" }}>
            🛒
            {cartCount > 0 && <span style={{ position: "absolute", top: -6, right: -10, background: "#D9A441", color: "#1B1F3B", fontSize: 9.5, fontWeight: 700, borderRadius: 999, minWidth: 14, height: 14, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>{cartCount}</span>}
          </span>Cart
        </button>
        <button onClick={() => setView("orders")} style={navBtn(view === "orders")}><span style={{ fontSize: 18 }}>📦</span>Orders</button>
      </nav>

      {/* FILTER SHEET */}
      <Sheet open={filterOpen} onClose={() => setFilterOpen(false)} title="Filter & Sort">
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: "#6B6858", textTransform: "uppercase", marginBottom: 8 }}>Sort by</div>
          <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ ...inputStyle, background: "#fff" }}>
            <option value="featured">Featured</option>
            <option value="priceLow">Price: low to high</option>
            <option value="priceHigh">Price: high to low</option>
            <option value="rating">Avg. customer rating</option>
          </select>
        </div>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: "#6B6858", textTransform: "uppercase", marginBottom: 8 }}>Category</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {CATS.map((c) => (
              <button key={c} onClick={() => setCategory(c)} style={{ background: category === c ? "#1B1F3B" : "#fff", color: category === c ? "#F1EAD9" : "#5C594A", border: "1px solid #D8D5C4", borderRadius: 999, padding: "7px 13px", fontSize: 12.5, fontWeight: 600 }}>{c}</button>
            ))}
          </div>
        </div>
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: "#6B6858", textTransform: "uppercase", marginBottom: 8 }}>Max price: {money(maxPrice)}</div>
          <input type="range" min={10} max={250} value={maxPrice} onChange={(e) => setMaxPrice(Number(e.target.value))} style={{ width: "100%" }} />
        </div>
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: "#6B6858", textTransform: "uppercase", marginBottom: 8 }}>Min rating</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[0, 3, 4, 4.5].map((r) => (
              <button key={r} onClick={() => setMinRating(r)} style={{ flex: 1, background: minRating === r ? "#C9603E" : "#fff", color: minRating === r ? "#fff" : "#5C594A", border: "1px solid #D8D5C4", borderRadius: 8, padding: "8px 0", fontSize: 12 }}>{r === 0 ? "Any" : r + "+"}</button>
            ))}
          </div>
        </div>
        <button onClick={() => setFilterOpen(false)} style={{ width: "100%", background: "#D9A441", color: "#1B1F3B", border: "none", borderRadius: 8, padding: "13px 0", fontWeight: 700, fontSize: 14 }}>Show {filtered.length} results</button>
      </Sheet>

      {/* CART SHEET */}
      <Sheet open={cartOpen} onClose={() => setCartOpen(false)} title={"Your cart (" + cartCount + ")"} heightVh={85}>
        {cartItems.length === 0 ? (
          <div style={{ textAlign: "center", color: "#8A8672", padding: "30px 0", fontSize: 13.5 }}>Your cart is empty.</div>
        ) : (
          <>
            {cartItems.map((i) => (
              <div key={i.id} style={{ display: "flex", gap: 12, background: "#fff", borderRadius: 8, padding: 10, marginBottom: 10 }}>
                <div style={{ background: CAT_ACCENT[i.category].bg, borderRadius: 6, width: 50, height: 50, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, flexShrink: 0 }}>{i.emoji}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{i.name}</div>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: "#1B1F3B", marginBottom: 6 }}>{money(i.price)}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <button onClick={() => setQty(i.id, i.qty - 1)} style={{ width: 26, height: 26, borderRadius: 6, border: "1px solid #D8D5C4", background: "#fff" }}>−</button>
                    <span style={{ fontSize: 13, minWidth: 16, textAlign: "center" }}>{i.qty}</span>
                    <button onClick={() => setQty(i.id, i.qty + 1)} style={{ width: 26, height: 26, borderRadius: 6, border: "1px solid #D8D5C4", background: "#fff" }}>+</button>
                    <button onClick={() => removeFromCart(i.id)} style={{ marginLeft: "auto", background: "none", border: "none", color: "#C9603E", fontSize: 15 }}>🗑</button>
                  </div>
                </div>
              </div>
            ))}
            <div style={{ background: "#fff", borderRadius: 8, padding: 14, marginTop: 6 }}>
              <SummaryRow label="Subtotal" value={subtotal} />
              <div style={{ fontSize: 11, color: "#3F7C74", marginBottom: 12 }}>{shipping === 0 ? "Free delivery included" : "Add " + money(35 - subtotal) + " more for free delivery"}</div>
              <button onClick={() => { setCartOpen(false); setView("checkout"); }} style={{ width: "100%", background: "#D9A441", color: "#1B1F3B", border: "none", borderRadius: 8, padding: "13px 0", fontWeight: 700, fontSize: 14 }}>Proceed to checkout</button>
            </div>
          </>
        )}
      </Sheet>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ShopMart />);
</script>
</body>
</html>
